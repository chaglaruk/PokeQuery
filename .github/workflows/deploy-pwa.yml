name: Deploy PWA to GitHub Pages

on:
  push:
    branches: [master]
    paths:
      - 'web/**'
      - '.github/workflows/deploy-pwa.yml'
      - 'app/src/test/resources/golden-corpus.json'
      - 'app/src/main/assets/knowledgebase.json'
      - 'docs/event-feed/pokequery-events.json'
      - 'scripts/check_web_fallback_fresh.py'
  pull_request:
    paths:
      - 'web/**'
      - '.github/workflows/deploy-pwa.yml'
      - 'app/src/test/resources/golden-corpus.json'
      - 'app/src/main/assets/knowledgebase.json'
      - 'docs/event-feed/pokequery-events.json'
      - 'scripts/check_web_fallback_fresh.py'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.ref == 'refs/heads/master' && 'pages' || format('pr-{0}', github.event.number) }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: 'web/package-lock.json'

      - name: Install dependencies
        run: npm ci
        working-directory: web

      - name: Golden corpus sync check
        run: npm run check:golden-corpus
        working-directory: web

      - name: Fallback freshness check
        run: python scripts/check_web_fallback_fresh.py

      - name: Typecheck
        run: npm run typecheck
        working-directory: web

      - name: Lint
        run: npm run lint
        working-directory: web

      - name: Run unit tests
        run: npm test
        working-directory: web

      - name: Build
        run: npm run build
        working-directory: web
        env:
          VITE_BASE: /PokeQuery/

      - name: Install Playwright browsers
        if: github.event_name == 'pull_request'
        run: npx playwright install --with-deps chromium webkit
        working-directory: web

      - name: Run Playwright E2E
        if: github.event_name == 'pull_request'
        run: npx playwright test
        working-directory: web
        env:
          CI: 'true'
          VITE_BASE: /PokeQuery/

      - name: Capture mobile visual QA
        if: github.event_name == 'pull_request'
        run: npx playwright test --config=playwright.screenshots.config.ts --project=chromium-mobile
        working-directory: web
        env:
          CI: 'true'
          VITE_BASE: /PokeQuery/

      - name: Upload Playwright report
        if: always() && github.event_name == 'pull_request'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: playwright-report
          path: web/playwright-report
          retention-days: 30

      - name: Upload visual QA screenshots
        if: always() && github.event_name == 'pull_request'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: pwa-mobile-visual-qa
          path: docs/screenshots/pwa_initial_qa/pixel-5
          retention-days: 30

      - name: Upload production artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: pokequery-dist
          path: web/dist
          retention-days: 30

      - name: Setup Pages
        if: github.ref == 'refs/heads/master'
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        if: github.ref == 'refs/heads/master'
        uses: actions/upload-pages-artifact@v3
        with:
          path: web/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/master'
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
