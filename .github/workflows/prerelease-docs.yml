name: Pre-release documentation validation

on:
  pull_request:
    paths:
      - 'README.md'
      - 'CHANGELOG.md'
      - 'docs/**/*.md'
      - 'scripts/check_prerelease_docs.py'
      - '.github/workflows/prerelease-docs.yml'
  push:
    branches: [master]
    paths:
      - 'README.md'
      - 'CHANGELOG.md'
      - 'docs/**/*.md'
      - 'scripts/check_prerelease_docs.py'
      - '.github/workflows/prerelease-docs.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Check local documentation links and copy limits
        run: python scripts/check_prerelease_docs.py
