name: PWA Playwright E2E

# Manual by design: routine PWA PRs use the fast deploy-pwa validation gate.
# Choose smoke for targeted regression checks, full for an explicit release gate,
# or visual for deterministic mobile screenshot evidence.
on:
  workflow_dispatch:
    inputs:
      suite:
        description: Playwright gate to run
        required: true
        default: smoke
        type: choice
        options:
          - smoke
          - full
          - visual

permissions:
  contents: read

concurrency:
  group: pwa-e2e-${{ github.ref }}-${{ inputs.suite }}
  cancel-in-progress: true

jobs:
  smoke:
    if: inputs.suite == 'smoke'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: 'web/package-lock.json'

      - name: Install dependencies
        run: npm ci
        working-directory: web

      - name: Install Chromium
        run: npx playwright install --with-deps chromium
        working-directory: web

      - name: Run targeted Chromium smoke suite
        run: npm run test:e2e:smoke
        working-directory: web
        env:
          CI: 'true'
          VITE_BASE: /PokeQuery/

      - name: Upload smoke report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: playwright-smoke-report
          path: web/playwright-report
          retention-days: 30

  full:
    if: inputs.suite == 'full'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - id: shard-1-of-2
            shard: 1/2
          - id: shard-2-of-2
            shard: 2/2
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: 'web/package-lock.json'

      - name: Install dependencies
        run: npm ci
        working-directory: web

      - name: Install Chromium + WebKit
        run: npx playwright install --with-deps chromium webkit
        working-directory: web

      - name: Run full E2E suite (${{ matrix.id }})
        run: npm run test:e2e -- --shard=${{ matrix.shard }}
        working-directory: web
        env:
          CI: 'true'
          VITE_BASE: /PokeQuery/

      - name: Upload full-suite report (${{ matrix.id }})
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: playwright-full-report-${{ matrix.id }}
          path: web/playwright-report
          retention-days: 30

  visual:
    if: inputs.suite == 'visual'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: 'web/package-lock.json'

      - name: Install dependencies
        run: npm ci
        working-directory: web

      - name: Install Chromium
        run: npx playwright install --with-deps chromium
        working-directory: web

      - name: Capture deterministic mobile visual QA
        run: npm run test:screenshots -- --project=chromium-mobile
        working-directory: web
        env:
          CI: 'true'
          VITE_BASE: /PokeQuery/

      - name: Upload visual QA screenshots
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: pwa-mobile-visual-qa
          path: docs/screenshots/pwa_initial_qa/pixel-5
          retention-days: 30
