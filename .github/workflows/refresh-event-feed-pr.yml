name: Refresh Event Feed PR Branch

on:
  push:
    branches: [fix/v076-post-release-bug-hunt]
    paths:
      - '.github/workflows/refresh-event-feed-pr.yml'

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout PR branch
        uses: actions/checkout@v4
        with:
          ref: fix/v076-post-release-bug-hunt
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Test enrichment
        run: python scripts/test_enrich_event_feed.py

      - name: Generate online feed
        run: python scripts/generate_event_feed.py

      - name: Enrich source pages strictly
        run: python scripts/enrich_event_feed.py docs/event-feed/pokequery-events.json --strict

      - name: Validate feed
        run: python scripts/validate_event_feed.py docs/event-feed/pokequery-events.json

      - name: Sync runtime fallbacks
        run: |
          cp docs/event-feed/pokequery-events.json app/src/main/res/raw/event_context_fallback.json
          cp docs/event-feed/pokequery-events.json web/public/event-feed-fallback.json

      - name: Commit refreshed feed to PR branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/event-feed/pokequery-events.json
          git add app/src/main/res/raw/event_context_fallback.json
          git add web/public/event-feed-fallback.json
          if git diff --cached --quiet; then
            echo "Feed already current."
            exit 0
          fi
          git commit -m "chore: refresh event feed after enrichment hardening"
          git push origin HEAD:fix/v076-post-release-bug-hunt
