name: Update Event Feed

on:
  schedule:
    - cron: '0 */12 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-feed:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Test Event Guide enrichment
        run: python scripts/test_enrich_event_feed.py

      - name: Generate Event Feed
        run: python scripts/generate_event_feed.py

      - name: Enrich Event Feed from source pages
        run: python scripts/enrich_event_feed.py docs/event-feed/pokequery-events.json --strict

      - name: Validate Event Feed
        run: python scripts/validate_event_feed.py docs/event-feed/pokequery-events.json

      - name: Sync Android and web fallbacks atomically
        run: |
          cp docs/event-feed/pokequery-events.json app/src/main/res/raw/event_context_fallback.json
          cp docs/event-feed/pokequery-events.json web/public/event-feed-fallback.json

      - name: Commit and Push Changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/event-feed/pokequery-events.json
          git add app/src/main/res/raw/event_context_fallback.json
          git add web/public/event-feed-fallback.json
          if git diff --cached --quiet; then
            echo "Event feed is already current."
            exit 0
          fi
          git commit -m "chore: update event feed JSON [skip ci]"
          git push origin master
