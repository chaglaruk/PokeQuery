name: v0.7.6 Golden Corpus Migration

on:
  pull_request:
    branches: [master]
    paths:
      - '.github/workflows/v076-golden-corpus-migrate.yml'

permissions:
  contents: write

jobs:
  migrate:
    if: github.head_ref == 'fix/v076-post-release-bug-hunt'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/v076-post-release-bug-hunt
      - name: Rewrite legacy pipe expectations
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          paths = [
              Path('app/src/test/resources/golden-corpus.json'),
              Path('web/src/parity/golden-corpus.json'),
          ]
          for path in paths:
              data = json.loads(path.read_text(encoding='utf-8'))
              by_id = {case['id']: case for case in data['testCases']}

              build = by_id.pop('buildstring-pipe-preserved')
              build['id'] = 'buildstring-pipe-normalized'
              build['expected'] = {
                  'rawSyntaxContains': ['test,query'],
                  'rawSyntaxNotContains': ['|'],
              }

              lint = by_id.pop('lint-pipe-supported')
              lint['id'] = 'lint-pipe-blocked'
              lint['expected'] = {
                  'hasError': True,
                  'warningsContain': ['|'],
              }

              policy = by_id.pop('expert-pipe-allows-copy')
              policy['id'] = 'expert-pipe-blocks-copy'
              policy['expected'] = {'canCopy': False}

              path.write_text(json.dumps(data, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')

          if paths[0].read_bytes() != paths[1].read_bytes():
              raise SystemExit('Golden corpora are not byte-identical after migration')
          PY
      - name: Commit only shared corpus files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/src/test/resources/golden-corpus.json
          git add web/src/parity/golden-corpus.json
          git diff --cached --quiet && exit 0
          git commit -m "test: migrate golden corpus to no-pipe policy"
          git push origin HEAD:fix/v076-post-release-bug-hunt
