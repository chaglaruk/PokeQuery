name: v0.7.6 Live Event Feed Proof

on:
  push:
    branches:
      - fix/v076-post-release-bug-hunt
    paths:
      - 'scripts/generate_event_feed.py'
      - 'scripts/enrich_event_feed.py'
      - 'scripts/test_enrich_event_feed.py'
      - 'docs/event-feed/**'
      - '.github/workflows/v076-live-event-feed-proof.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: v076-live-event-feed-proof
  cancel-in-progress: true

jobs:
  generate-validate-sync:
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/fix/v076-post-release-bug-hunt'
    steps:
      - name: Checkout audited fix branch
        uses: actions/checkout@v4
        with:
          ref: fix/v076-post-release-bug-hunt
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Generate live Event Guide feed
        run: python scripts/generate_event_feed.py

      - name: Enrich live Event Guide feed
        run: python scripts/enrich_event_feed.py docs/event-feed/pokequery-events.json --strict

      - name: Validate enriched feed
        run: python scripts/validate_event_feed.py docs/event-feed/pokequery-events.json

      - name: Sync runtime fallbacks
        run: |
          cp docs/event-feed/pokequery-events.json app/src/main/res/raw/event_context_fallback.json
          cp docs/event-feed/pokequery-events.json web/public/event-feed-fallback.json

      - name: Commit only audited feed files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/event-feed/pokequery-events.json
          git add app/src/main/res/raw/event_context_fallback.json
          git add web/public/event-feed-fallback.json
          if git diff --cached --quiet; then
            echo "Live enriched feed already matches branch."
            exit 0
          fi
          git commit -m "data: sync enriched v076 event feed"
          git push origin HEAD:fix/v076-post-release-bug-hunt
